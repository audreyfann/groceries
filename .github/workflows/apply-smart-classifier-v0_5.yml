name: Apply smart classifier v0.5

on:
  push:
    branches: [main]
    paths:
      - patches/smart-classifier-v0_5.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply update archive
        shell: bash
        run: |
          set -euo pipefail
          cat patches/smart-classifier-v0_5.part* | base64 -d > /tmp/smart-classifier-v0_5.tar.gz
          tar -xzf /tmp/smart-classifier-v0_5.tar.gz -C .
          cp apps_script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          grep -q "const VERSION = '0.5.0';" apps_script/Code.gs
          grep -q "classify_ingredients" backend/app/recommender.py

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. python -m pytest -q

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          rm -f patches/smart-classifier-v0_5.part* patches/smart-classifier-v0_5.ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add smart ingredient classification and supplier routing'
          git push origin HEAD:main
