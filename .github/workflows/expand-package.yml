name: Expand grocery planner package

on:
  push:
    branches: [main]
    paths:
      - hamm_grocery_planner_v0_3.zip
      - .github/workflows/expand-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hamm_grocery_planner_v0_3.zip

      - name: Expand package into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f hamm_grocery_planner_v0_3.zip
          rm -rf /tmp/hamm-grocery-planner
          mkdir -p /tmp/hamm-grocery-planner
          unzip -q hamm_grocery_planner_v0_3.zip -d /tmp/hamm-grocery-planner
          test -d /tmp/hamm-grocery-planner/grocery_planner_v0_3
          cp -a /tmp/hamm-grocery-planner/grocery_planner_v0_3/. .
          rm -rf .pytest_cache backend/.pytest_cache backend/app/__pycache__ backend/tests/__pycache__

      - name: Make repository instructions match the expanded layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'head_cook_grocery_planner_v0_3.xlsx  Ready-to-upload version of the real tracker',
              'workbook/head_cook_grocery_planner_v0_3.xlsx  Ready-to-upload version of the real tracker',
          )
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Add continuous integration for future changes
        shell: bash
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/backend-tests.yml <<'YAML'
          name: Backend tests

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                    cache: pip
                    cache-dependency-path: backend/requirements.txt
                - run: python -m pip install --upgrade pip
                - run: pip install -r requirements.txt
                - run: python -m pytest -q
          YAML

      - name: Install dependencies and run tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Expand Hamm grocery planner v0.3'
          git push origin HEAD:main
